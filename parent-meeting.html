portrait;margin:10mm}@media print{body{background:#fff}header,main,body>footer{display:none!important}#printArea{display:block!important}.paper{page-break-after:always;break-after:page;padding:0;font-size:10pt}.paper:last-child{page-break-after:auto;break-after:auto}.paper td.notes{height:42px}}@media(max-width:500px){.panel{padding:17px}.paper{padding:8mm}} .official{display:grid;grid-template-columns:1fr 1.4fr 1fr;gap:8px;align-items:center;border-bottom:2px solid #333;padding-bottom:10px;font-weight:700;font-size:10pt}.official-center{text-align:center;font-size:13pt}.official-center small{font-size:9pt}.official-left{text-align:left}.behavior{font-size:9pt;line-height:1.7;white-space:nowrap}.writing-lines{font-size:9pt;color:#888;line-height:2.2}.signoff{margin-top:16px;font-size:10pt}.paper td.notes{height:62px}@media print{.paper{font-size:9pt}.paper td.notes{height:56px}.paper th,.paper td{padding:3px 4px}.behavior{font-size:7.4pt;line-height:1.32}.writing-lines{font-size:8pt;line-height:1.7}}  @media print{@page{size:A4 portrait;margin:7mm}.paper{font-size:8.5pt}.paper h2{font-size:13pt;margin:5px 0}.paper .meta{margin:7px 0;gap:4px}.paper footer{margin-top:7px}.official{padding-bottom:5px;font-size:8.5pt}.official-center{font-size:11pt}.signoff{margin-top:8px;font-size:9pt}.paper table{break-inside:auto}.paper tr{break-inside:avoid;page-break-inside:avoid}.paper td{overflow-wrap:anywhere}.paper td.notes{height:50px}} </style></head><body><header><p>مدرسة سعد بن معاذ</p><h1>ملتقى أولياء الأمور</h1><p>الخميس ٣ ديسمبر ٢٠٢٦ | استمارات المتابعة الورقية</p></header><main><section class="panel"><h2>البحث عن الطالب</h2><p class="hint">اختر الصف والشعبة، ثم اكتب اسم الطالب. يمكنك البحث دون كتابة الهمزات أو «بن».</p><form id="lookup"><label for="classCode">الصف والشعبة</label><select id="classCode" required><option value="">اختر الصف والشعبة</option><option value="الخامس|1">الخامس — 1</option><option value="الخامس|2">الخامس — 2</option><option value="الخامس|3">الخامس — 3</option><option value="الخامس|4">الخامس — 4</option><option value="الخامس|5">الخامس — 5</option><option value="الخامس|6">الخامس — 6</option><option value="الخامس|7">الخامس — 7</option><option value="الخامس|8">الخامس — 8</option><option value="الخامس|9">الخامس — 9</option><option value="السادس|1">السادس — 1</option><option value="السادس|2">السادس — 2</option><option value="السادس|3">السادس — 3</option><option value="السادس|4">السادس — 4</option><option value="السادس|5">السادس — 5</option><option value="السادس|6">السادس — 6</option><option value="السادس|7">السادس — 7</option><option value="السادس|8">السادس — 8</option><option value="السادس|9">السادس — 9</option><option value="السابع|1">السابع — 1</option><option value="السابع|2">السابع — 2</option><option value="السابع|3">السابع — 3</option><option value="السابع|4">السابع — 4</option><option value="السابع|5">السابع — 5</option><option value="السابع|6">السابع — 6</option><option value="السابع|7">السابع — 7</option><option value="السابع|8">السابع — 8</option><option value="السابع|9">السابع — 9</option><option value="الثامن|1">الثامن — 1</option><option value="الثامن|2">الثامن — 2</option><option value="الثامن|3">الثامن — 3</option><option value="الثامن|4">الثامن — 4</option><option value="الثامن|5">الثامن — 5</option><option value="الثامن|6">الثامن — 6</option><option value="الثامن|7">الثامن — 7</option><option value="الثامن|8">الثامن — 8</option><option value="الثامن|9">الثامن — 9</option></select><label for="studentName">اسم الطالب</label><input id="studentName" required minlength="4" autocomplete="off" placeholder="اكتب اسم الطالب"><button id="search" type="submit">بحث</button></form><p id="status" class="status" role="status"></p><div id="matches"></div></section><section class="panel" id="preview" hidden><h2>استمارة الطالب</h2><p id="studentInfo"></p><button id="print">طباعة الاستمارة A4</button><button class="secondary" id="back">بحث جديد</button></section></main><div id="printArea"></div><footer>إعداد وتنظيم: الأستاذ خليل البلوشي</footer><script>const API='https://script.google.com/macros/s/AKfycbxaE54AYPy3XPTl7JUUw_nVEjA466BJqwZvwHfwPObBAxUuP_tfSZWgmbbne2xMsnxh/exec';const $=id=>document.getElementById(id);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\\x27':'&#39;'}[c]));async function call(action,extra){const r=await fetch(API,{method:'POST',headers:{'Content-Type':'text/plain;charset=UTF-8'},body:JSON.stringify({action,...extra})});if(!r.ok)throw Error('تعذر الاتصال بالخادم');const j=await r.json();if(!j.ok)throw Error(j.error||'تعذر البحث');return j}let matches=[];$('lookup').onsubmit=async e=>{e.preventDefault();$('search').disabled=true;$('status').textContent='جارٍ البحث...';$('matches').innerHTML='';$('preview').hidden=true;try{const [grade,section]=$('classCode').value.split('|');const j=await call('meetingFind',{grade,section,name:$('studentName').value.trim()});matches=j.matches||[];$('matches').innerHTML=matches.map((m,i)=>'<div class="student"><span style="flex:1"><strong>'+esc(m.name)+'</strong>'+esc(m.grade)+' — الشعبة '+esc(m.section)+'</span><button data-index="'+i+'">اختيار</button></div>').join('');$('status').textContent=matches.length?'اختر الاسم الصحيح من النتائج':'لم نجد نتيجة مطابقة'}catch(err){$('status').textContent=err.message}finally{$('search').disabled=false}};$('matches').onclick=async e=>{const i=e.target.dataset.index;if(i===undefined)return;const m=matches[Number(i)];if(!m)return;$('status').textContent='جارٍ تجهيز الاستمارة...';try{const j=await call('meetingPrint',{student:m});const s=j.student;$('printArea').innerHTML='<article class="paper"><div class="official"><div class="official-right">سلطنة عُمان<br>وزارة التعليم<br>مدرسة سعد بن معاذ للتعليم الأساسي</div><div class="official-center">استمارة ملتقى أولياء الأمور<br><small>الخميس ٣ ديسمبر ٢٠٢٦</small></div><div class="official-left">العام الدراسي ٢٠٢٦ / ٢٠٢٧</div></div><h2>متابعة الجوانب السلوكية والتحصيلية</h2><div class="meta"><div><b>الطالب:</b> '+esc(s.name)+'</div><div><b>الصف والشعبة:</b> '+esc(s.grade)+' / '+esc(s.section)+'</div></div><table><thead><tr><th style="width:12%">المادة</th><th style="width:17%">معلم المادة</th><th style="width:29%">الجانب السلوكي (اختر ما ينطبق)</th><th style="width:42%">الجانب التحصيلي (يكتبه المعلم)</th></tr></thead><tbody>'+(s.subjects.length?s.subjects.map(x=>'<tr><td>'+esc(x.subject)+'</td><td>'+esc(x.teacher)+'</td><td class="behavior">□ يلتزم بأنظمة الصف<br>□ يحترم المعلم وزملاءه<br>□ يتعاون مع زملائه<br>□ يحتاج إلى تحسين الانضباط<br>□ يحتاج إلى تعزيز احترام الآخرين</td><td class="notes"><div class="writing-lines">........................................................<br>........................................................</div></td></tr>').join(''):'<tr><td colspan="4">يرجى مراجعة الإدارة لاستكمال المواد</td></tr>')+'</tbody></table><div class="signoff">توقيع ولي الأمر: .................................. </div><footer>إعداد وتنظيم: الأستاذ خليل البلوشي</footer></article>';$('studentInfo').textContent=s.name+' — '+s.grade+' / '+s.section;$('preview').hidden=false;$('status').textContent='';$('preview').scrollIntoView({behavior:'smooth'})}catch(err){$('status').textContent=err.message}};$('print').onclick=()=>window.print();$('back').onclick=()=>{$('preview').hidden=true;$('printArea').innerHTML='';$('studentName').focus()};</script></body></html>
