<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
*{box-sizing:border-box}html{font-family:Tahoma,Arial,sans-serif}body{margin:0;background:#f4f8f6;color:#1c3433;line-height:1.6}
header{background:linear-gradient(125deg,#123c46,#176c63);color:#fff;padding:27px max(18px,calc((100vw - 1150px)/2)) 46px}

let subjects=FALLBACK_SUBJECTS;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s||'').normalize('NFKC').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/\s+/g,' ').trim();
function subjectOf(name,cls){
 const key=Object.keys(subjects).find(n=>normalize(n)===normalize(name));
 const fallbackKey=Object.keys(FALLBACK_SUBJECTS).find(n=>normalize(n)===normalize(name));
 return (subjects[key]||{})[cls]||(FALLBACK_SUBJECTS[fallbackKey]||{})[cls]||'المادة غير مسجلة في المصدر';
}
function render(){
 const groups=new Map(),d=day.value,p=Number(period.value);
 Object.entries(DATA).forEach(([teacher,days])=>{
  const c=days[d]?.[p-1];if(!c)return;
  if(!groups.has(c))groups.set(c,[]);
  groups.get(c).push(teacher);
 });
 const ordered=[...groups].sort(([a],[b])=>{
  const x=a.split('/').map(Number),y=b.split('/').map(Number);
  return x[1]-y[1]||x[0]-y[0];
 });
 const conflicts=ordered.filter(([,names])=>names.length>1).length;
 summary.innerHTML='<strong>'+ordered.length+' شعبة لديها حصة</strong><span>'+esc(d)+' — الحصة '+p+(conflicts?' — '+conflicts+' تعارض':'')+'</span>';
 cards.innerHTML=ordered.length?ordered.map(([cls,names])=>'<article class="card'+(names.length>1?' conflict':'')+'"><div class="top"><span>الصف '+esc(cls.split('/')[1])+'</span><b>الشعبة '+esc(cls.split('/')[0])+'</b></div>'+names.map(name=>'<div class="details"><div class="teacher">'+esc(name)+'</div><div class="subject">'+esc(subjectOf(name,cls))+'</div></div>').join('')+(names.length>1?'<div class="alert">تعارض في الجدول، يرجى المراجعة</div>':'')+'</article>').join(''):'<p>لا توجد حصص مسجلة في هذا الوقت.</p>';
}
day.addEventListener('change',render);period.addEventListener('change',render);render();
fetch(API+'?action=subjects',{cache:'no-store'}).then(r=>r.json()).then(j=>{if(j.ok&&j.subjects&&typeof j.subjects==='object'){subjects={...FALLBACK_SUBJECTS,...j.subjects};render();document.getElementById('dataStatus').textContent='المواد الدراسية متزامنة مع سجل المواد.'}}).catch(()=>{});
</script></body></html>
