<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>لوحة متابعة اليوم الدراسي | بوابة سعد</title><link rel="stylesheet" href="assets/school-tools.css"><script src="assets/meeting-data.js?v=20261116-shared-timetable" defer></script><link rel="stylesheet" href="assets/theme.css?v=20261117"></head>
<body><header><div><a href="administration.html">العودة إلى الإدارة المدرسية</a><h1>لوحة متابعة اليوم الدراسي</h1><p>مدرسة سعد بن معاذ للتعليم الأساسي</p></div></header><main>
<section><div class="fields"><label>التاريخ<input type="date" id="date" required></label><label>رمز الإدارة<input type="password" id="key" autocomplete="off"></label></div><div class="actions"><button id="progress" class="primary">عرض المتابعة</button></div><p id="progressStatus" role="status"></p><div id="progressOutput"></div></section>
<section><h2>جرّب تبديل الحصص</h2><div class="fields"><label>الصف والشعبة<select id="swapGroup"></select></label><label>الحصة الأولى للتبديل<select id="first"></select></label><label>الحصة الثانية للتبديل<select id="second"></select></label></div><div class="actions"><button id="preview">معاينة التبديل</button><button id="publish" class="primary" disabled>اعتماد التبديل ونشره</button></div><p id="swapStatus" role="status"></p></section>
<section><h2>تحقّق من موعد اجتماع</h2><label>الحصة<select id="meetingSlot"></select></label><fieldset><legend>المعلمون المشاركون</legend><label>بحث في الأسماء<input id="teacherFilter" type="search"></label><div id="teacherList" class="teacher-list"></div></fieldset><div class="actions"><button id="checkMeeting">فحص الموعد</button></div><p id="meetingStatus" role="status"></p></section>
<section><h2>انشر تنبيهًا لشعبة</h2><div class="fields"><label>الصف والشعبة<select id="noteGroup"></select></label><label>الحصة<select id="noteSlot"></select></label></div><label>ما التغيير؟<textarea id="note" rows="2" maxlength="240" placeholder="مثال: تُعقد الحصة الثالثة في المختبر."></textarea></label><div class="actions"><button id="publishNote" class="primary">نشر التنبيه</button><a href="school-updates.html">صفحة تغييرات اليوم</a></div><p id="noteStatus" role="status"></p></section>
</main><footer>إعداد الأستاذ خليل البلوشي</footer>
<script>
'use strict';
const endpoint='https://script.google.com/macros/s/AKfycbxaE54AYPy3XPTl7JUUw_nVEjA466BJqwZvwHfwPObBAxUuP_tfSZWgmbbne2xMsnxh/exec';
const attendance=endpoint+'?action=attendance';
const $=id=>document.getElementById(id);
const grades=[[5,'الخامس',6],[6,'السادس',6],[7,'السابع',7],[8,'الثامن',5]];
const groupLabel=code=>{const [g,s]=code.split('/');return s?(grades.find(item=>String(item[0])===g)?.[1]||g)+' — الشعبة '+s:'الشعبة غير محددة'};
const groupCodes=grades.flatMap(([g,,n])=>Array.from({length:n},(_,i)=>g+'/'+(i+1)));
const date=$('date');
const dateParts=Object.fromEntries(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Muscat',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts().map(p=>[p.type,p.value]));
date.value=[dateParts.year,dateParts.month,dateParts.day].join('-');
let draft=null, swapRevision=0, progressRevision=0;
for(const id of ['swapGroup','noteGroup'])for(const group of groupCodes)$(id).add(new Option(groupLabel(group),group));
for(const id of ['first','second','meetingSlot','noteSlot']){
 if(id==='noteSlot')$(id).add(new Option('عام للشعبة','0'));
 for(let i=1;i<=8;i++)$(id).add(new Option('الحصة '+i,String(i)));
}
$('second').value='2';
function invalidate(){draft=null;swapRevision++;$('publish').disabled=true;$('swapStatus').textContent=''}
for(const id of ['date','swapGroup','first','second'])$(id).addEventListener('change',invalidate);
date.addEventListener('change',()=>{
 progressRevision++;
 $('progressOutput').replaceChildren();
 for(const id of ['progressStatus','meetingStatus','noteStatus'])$(id).textContent='';
});
async function send(action,fields={}){
 if(!date.reportValidity())throw Error('اختر التاريخ.');
 const adminKey=$('key').value;
 if(!adminKey)throw Error('أدخل رمز الإدارة.');
 const res=await fetch(endpoint,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({action,adminKey,date:date.value,...fields})});
 const data=await res.json();
 if(!data.ok)throw Error(data.error==='إجراء غير معروف'?'يلزم تحديث نشر Apps Script لإتاحة هذه الخدمة.':data.error||'تعذّر إتمام الطلب.');
 return data;
}
function run(button,status,work){
 $(button).onclick=async()=>{
  $(button).disabled=true;$(status).textContent='جارٍ التنفيذ…';
  try{await work();}catch(error){$(status).textContent=error.message;}
  finally{$(button).disabled=button==='publish'&&!draft;}
 };
}
run('preview','swapStatus',async()=>{
 draft=null;$('publish').disabled=true;
 const version=++swapRevision;
 const r=await send('schoolPreviewSwap',{group:$('swapGroup').value,first:$('first').value,second:$('second').value});
 if(version!==swapRevision)return;
 const conflicts=r.conflicts.map(x=>x.teacher+' مع '+groupLabel(x.group)+' في الحصة '+x.slot);
 $('swapStatus').textContent=groupLabel(r.group)+' · الحصة '+r.first+' تصبح مع '+r.afterFirst+'، والحصة '+r.second+' تصبح مع '+r.afterSecond+
  (conflicts.length?' · تعارض: '+conflicts.join('، '):' · لا يوجد تعارض في الجدول.');
 if(!conflicts.length){draft=r;$('publish').disabled=false;}
});
run('publish','swapStatus',async()=>{
 if(!draft)return;
 const r=await send('schoolPublishChange',{...draft,type:'swap'});
 draft=null;
 $('swapStatus').textContent='اعتُمد التبديل ونُشر ليوم '+r.date+'.';
});
run('publishNote','noteStatus',async()=>{
 const r=await send('schoolPublishChange',{type:'note',group:$('noteGroup').value,slot:$('noteSlot').value,text:$('note').value});
 $('note').value='';$('noteStatus').textContent='نُشر التنبيه ليوم '+r.date+'.';
});
function progressList(title,items,href){
 const block=document.createElement('details'), summary=document.createElement('summary'), link=document.createElement('a');
 summary.textContent=title+' · '+items.length;
 link.href=href;link.textContent='فتح الخدمة';
 block.append(summary,link);
 const list=document.createElement('ul');
 for(const row of items){
  const item=document.createElement('li');
  item.textContent=[groupLabel(row.group), 'الحصة '+row.slot,row.teacher].join(' · ');
  list.append(item);
 }
 block.append(list);
 return block;
}
run('progress','progressStatus',async()=>{
 const version=++progressRevision;
 const r=await send('schoolProgress');
 if(version!==progressRevision)return;
 $('progressStatus').textContent='الحصص المدرسية في '+r.date+' · '+r.scheduled;
 $('progressOutput').replaceChildren(progressList('تسجيل الغياب غير مكتمل',r.missing,attendance),progressList('بانتظار اعتماد المعلم',r.waiting,attendance),progressList('حصص احتياط غير مغطاة',r.uncovered,'../reserve.html'));
});
window.addEventListener('DOMContentLoaded',()=>{
 const teacherNames=Object.keys(window.SAAD_TIMETABLE?.teachers||{}).sort((a,b)=>a.localeCompare(b,'ar'));
 for(const teacher of teacherNames){
  const label=document.createElement('label'), input=document.createElement('input');
  label.className='teacher-choice';input.type='checkbox';input.value=teacher;
  label.append(input,document.createTextNode(teacher));$('teacherList').append(label);
 }
 $('teacherFilter').oninput=()=>{const q=$('teacherFilter').value.trim();for(const label of $('teacherList').children)label.hidden=!label.textContent.includes(q)};
});
run('checkMeeting','meetingStatus',async()=>{
 const teachers=[...$('teacherList').querySelectorAll('input:checked')].map(i=>i.value);
 const r=await send('schoolMeetingCheck',{slot:$('meetingSlot').value,teachers});
 $('meetingStatus').textContent=r.conflicts.length?r.conflicts.map(c=>c.teacher+' — '+(c.groups.map(groupLabel).join('، ')||'غير متاح')).join(' · '):'المعلمون المختارون متاحون وفق الجدول.';
});
</script></body></html>
