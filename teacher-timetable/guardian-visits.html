<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>الملتقى غير متوفر</title><style>*{box-sizing:border-box}body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:20px;background:linear-gradient(145deg,#101d28,#23343a);color:#f6f2e9;font-family:Tahoma,Arial,sans-serif}.dialog{width:min(100%,620px);padding:55px 25px;text-align:center;border:1px solid #ffffff2b;border-radius:24px;background:#ffffff09;box-shadow:0 24px 80px #0005}.poem{font-size:clamp(21px,4vw,31px);line-height:2.1}.notice{font-size:19px;color:#d9d7d1;margin-top:35px}.credit{font-size:12px;color:#a6b1b1;margin-top:35px}</style></head><body><main class="dialog" role="dialog" aria-modal="true"><div class="poem">كانَ هناكَ شغفٌ،<br>وخفتَ نورُهُ مع ضوءِ الصباح،<br>فبقيتُ وحدي أحملُ ما لم يرَهُ أحد.</div><p class="notice">عذرًا، لم تعد هذه الصفحات متوفرة.</p><p class="credit">الأستاذ خليل البلوشي</p></main></body></html>
