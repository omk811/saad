<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex"><title>الصفحة غير متوفرة | بوابة سعد</title><style>*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Tahoma,Arial,sans-serif;background:#0b1720;color:#f6f2e9}body{min-height:100dvh;display:grid;place-items:center;padding:20px}.overlay{position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:20px;background:linear-gradient(150deg,#101f29,#192c33 55%,#0b1720);overflow:auto}.dialog{width:min(100%,600px);padding:clamp(28px,6vw,58px) 24px;text-align:center;border:1px solid #ffffff25;border-radius:24px;background:#ffffff09;box-shadow:0 24px 90px #0005}.line{height:2px;width:65px;margin:0 auto 30px;background:#d3b77d}.poem{font-size:clamp(21px,4.5vw,32px);line-height:2.1;font-weight:500;white-space:pre-line;margin:0}.message{font-size:clamp(16px,3vw,20px);margin:28px 0 0;color:#d5d5d0}.credit{font-size:12px;color:#9da9a9;margin-top:38px}</style></head><body><main class="overlay" role="dialog" aria-modal="true" aria-labelledby="unavailable" aria-describedby="poem"><div class="dialog"><div class="line"></div><p class="poem" id="poem">كانَ هناكَ شغفٌ،<br>وخفتَ نورُهُ مع ضوءِ الصباح،<br>فبقيتُ وحدي أحملُ ما لم يرَهُ أحد.</p><p class="message" id="unavailable">عذرًا، لم تعد هذه الصفحات متوفرة.</p><p class="credit">الأستاذ خليل البلوشي</p></div></main></body></html>
